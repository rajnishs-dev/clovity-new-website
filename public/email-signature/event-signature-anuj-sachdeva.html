<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Email Signature</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="left">
          <!-- MAIN CONTAINER -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="border-collapse: collapse; background: #ffffff"
          >
            <!-- ================= TOP SECTION ================= -->
            <tr>
              <td style="padding: 18px 20px; padding-bottom: 8px">
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <!-- PROFILE IMAGE -->
                    <td width="110" valign="top" style="padding-right: 5px">
                      <img
                        src="https://clovity-website.s3.ap-south-1.amazonaws.com/Anuj01_11_1f069e4dfe.png"
                        width="100"
                        style="display: block; border-radius: 48px"
                      />
                    </td>

                    <!-- VERTICAL DIVIDER -->
                    <td width="1" style="background: #cfcfcf"></td>

                    <!-- NAME & CONTACT -->
                    <td width="240" valign="top" style="padding-left: 14px">
                      <table cellpadding="0" cellspacing="0">
                        <tr>
                          <td
                            style="
                              font-size: 16px;
                              font-weight: bold;
                              color: #0b5bd3;
                            "
                          >
                            Anuj Sachdeva
                          </td>
                        </tr>

                        <tr>
                          <td
                            style="
                              font-size: 12px;
                              color: #000000;
                              padding-bottom: 8px;
                            "
                          >
                            CEO &amp; Founder
                          </td>
                        </tr>

                        <tr>
                          <td
                            style="
                              font-size: 12px;
                              color: #000000;
                              padding-bottom: 4px;
                            "
                          >
                            <img
                              src="https://clovity-website.s3.ap-south-1.amazonaws.com/Mail_05_4217b94ba3.png"
                              width="14"
                              style="vertical-align: middle"
                            />&nbsp; anujs@clovity.com
                          </td>
                        </tr>

                        <tr>
                          <td
                            style="
                              font-size: 12px;
                              color: #000000;
                              padding-bottom: 4px;
                            "
                          >
                            <img
                              src="https://clovity-website.s3.ap-south-1.amazonaws.com/Website_05_6699e16bb2.png"
                              width="14"
                              style="vertical-align: middle"
                            />&nbsp; www.clovity.com
                          </td>
                        </tr>

                        <tr>
                          <td style="font-size: 12px; color: #000000">
                            <img
                              src="https://clovity-website.s3.ap-south-1.amazonaws.com/Phone_05_9d0f859007.png"
                              width="14"
                              style="vertical-align: middle"
                            />&nbsp; +1 925-698-8293
                          </td>
                        </tr>
                      </table>
                    </td>

                    <!-- VERTICAL DIVIDER -->
                    <td width="1" style="background: #cfcfcf"></td>

                    <!-- Logo and tagline -->
                    <td
                      align="left"
                      valign="center"
                      width="140"
                      style="padding-right: 10px; padding-left: 16px"
                    >
                      <table
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="border-collapse: collapse"
                      >
                        <tbody>
                          <tr>
                            <td style="padding-bottom: 6px">
                              <a href="/" target="_blank">
                                <img
                                  src="https://clovity-website.s3.ap-south-1.amazonaws.com/07_07_f4ed2f932e.jpg"
                                  alt="Clovity Logo"
                                  width="140"
                                  style="display: block; border: 0"
                                />
                              </a>
                            </td>
                          </tr>
                          <tr>
                            <td
                              style="
                                font-size: 12px;
                                color: #0b53a1;
                                font-weight: bold;
                                padding-top: 6px;
                                line-height: normal;
                              "
                            >
                              An E-Verify Employer
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </td>

                    <!-- Social Icons -->
                    <td align="right" valign="center" width="30">
                      <table
                        cellpadding="2"
                        cellspacing="0"
                        border="0"
                        style="border-collapse: collapse"
                      >
                        <tbody>
                          <tr>
                            <td style="padding-bottom: 10px">
                              <a
                                href="https://www.linkedin.com/company/clovity/"
                                target="_blank"
                              >
                                <img
                                  src="https://clovity-website.s3.ap-south-1.amazonaws.com/linkedin_05_3db5f42683.png"
                                  alt="LinkedIn"
                                  width="24"
                                  style="display: block; border: 0"
                                />
                              </a>
                            </td>
                          </tr>
                          <tr>
                            <td style="padding-bottom: 10px">
                              <a
                                href="https://x.com/ClovityInc"
                                target="_blank"
                              >
                                <img
                                  src="https://clovity-website.s3.ap-south-1.amazonaws.com/Twitter_05_b39bc52e9f.png"
                                  alt="X"
                                  width="24"
                                  style="display: block; border: 0"
                                />
                              </a>
                            </td>
                          </tr>
                          <tr>
                            <td style="padding-bottom: 10px">
                              <a
                                href="https://www.youtube.com/@clovityinc"
                                target="_blank"
                              >
                                <img
                                  src="https://clovity-website.s3.ap-south-1.amazonaws.com/youtube_05_1_fcee288163.png"
                                  alt="YouTube"
                                  width="24"
                                  style="display: block; border: 0"
                                />
                              </a>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- HORIZONTAL DIVIDER -->
            <tr>
              <td style="padding: 0 20px">
                <hr style="border: none; height: 1px; background: #d1d5db" />
              </td>
            </tr>

            <!-- ================= EVENT SECTION ================= -->
            <tr>
              <td style="padding: 0px 20px">
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <!-- MEET US AT -->
                    <!-- <td
                      width="150"
                      valign="middle"
                      bgcolor="#ffffff"
                      style="
                        font-size: 18px;
                        font-weight: bold;
                        color: #1a73e8;
                        background-color: #ffffff;
                        -webkit-text-fill-color: #1a73e8;
                      "
                    >
                      Meet us at
                    </td> -->

                    <!-- TEAM ON TOUR -->
                    <td
                      valign="middle"
                      align="center"
                      width="350"
                      style="padding-right: 5px"
                    >
                      <a
                        href="https://clovity.com/atlassian-team-on-tour-government"
                        target="_blank"
                        style="text-decoration: none; display: block"
                        ><img
                          src="https://clovity-website.s3.ap-south-1.amazonaws.com/077_07_e941c974eb.jpg"
                          width="330"
                          height="62"
                          border="0"
                          alt="Check it"
                          style="
                            display: block;
                            outline: none;
                            text-decoration: none;
                            -ms-interpolation-mode: bicubic;
                          "
                      /></a>
                    </td>

                    <!-- PLATINUM PARTNER -->
                    <td valign="middle" align="right" width="250">
                      <img
                        src="https://clovity-website.s3.ap-south-1.amazonaws.com/platinum_partner_Platinum_partner_907f6dab9e.png"
                        width="245"
                        style="display: block"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- ================= DATE / LOCATION / BADGES ================= -->
            <tr>
              <td style="padding: 12px 20px 20px 20px">
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td width="25%" style="font-size: 12px; color: #000000">
                      <img
                        src="https://clovity-website.s3.ap-south-1.amazonaws.com/calendar_05_1_af2dbc36f1.png"
                        width="18"
                        style="vertical-align: middle"
                      />&nbsp; February 11, 2026
                    </td>

                    <td
                      width="25%"
                      align="center"
                      style="font-size: 12px; color: #000000"
                    >
                      <img
                        src="https://clovity-website.s3.ap-south-1.amazonaws.com/location_05_7a90dd2629.png"
                        width="18"
                        style="vertical-align: middle"
                      />&nbsp; Washington, DC
                    </td>

                    <td width="50%" align="right">
                      <img
                        src="https://clovity-website.s3.ap-south-1.amazonaws.com/USPAACC_01_ad42739d70.png"
                        width="75"
                        style="max-width: 100%"
                      />&nbsp;
                      <img
                        src="https://clovity-website.s3.ap-south-1.amazonaws.com/Great_place_to_work_Great_Place_to_Work_260d85bb1c.png"
                        width="75"
                        style="max-width: 100%"
                      />&nbsp;
                      <img
                        src="https://clovity-website.s3.ap-south-1.amazonaws.com/INC_500_INC_500_f557a0eb6e.png"
                        width="75"
                        style="max-width: 100%"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!-- END CONTAINER -->
        </td>
      </tr>
    </table>
  </body>
</html>
